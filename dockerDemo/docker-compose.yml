version: "3.9"

services:
  frontend:
    image: fr172m/frontend:v0.2
    ports:
      - "5173:80"
    depends_on:
      - backend

  backend:
    image: fr172m/backend:v0.2
    env_file:
      - .env.docker
    ports:
      - "3000:3000"
    depends_on:
      - db
      - sandbox

  db:
    image: fr172m/db:v0.2
    env_file:
      - .env.docker
    ports:
      - "5432:5432"

  sandbox:
    image: fr172m/sandbox:v0.2
